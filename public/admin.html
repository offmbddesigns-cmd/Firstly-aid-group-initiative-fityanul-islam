<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Fityanul Islam</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand"><div class="logo"><img src="/badge.jpg" alt="First Aid Group Initiative badge"></div><div><b>FIRST AID GROUP INITIATIVE</b><span>ADMIN PORTAL</span></div></div><a class="admin" href="/">Public site</a></header><main class="form-card" style="margin-top:50px"><div id="login"><h2>Admin sign in</h2><p class="muted">Authorized administrators only.</p><form id="loginForm"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p id="loginMsg"></p></form></div><div id="dash" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h2>Member approvals</h2><button onclick="logout()">Log out</button></div><div class="row" style="margin-bottom:20px"><select id="filter" onchange="load()"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="all">All</option></select><button onclick="load()">Refresh</button></div><div id="members"></div><hr><h2>Member office & rank</h2><p class="muted">Only authorized administrators can assign or change rank and office descriptions. Members can view them but cannot edit them.</p><form id="manageForm"><input type="hidden" id="memberId"><div class="grid"><label>Member database ID<input id="dbId" placeholder="ID shown in approval list"></label><label>Rank<input id="rank" placeholder="e.g. Unit Commander"></label><label>Office / Unit<input id="unit"></label><label>Year of entry<input id="year"></label></div><label>Office description<textarea id="officeDescription" placeholder="Describe the office/unit and update this when its duties change."></textarea></label><button type="button" onclick="saveDetails()">Save office & rank</button><span id="detailMsg"></span></form><hr><h2>Add approval admin</h2><form id="adminForm"><div class="grid"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label></div><button>Add admin</button><span id="adminMsg"></span></form></div></main><script>const login=document.getElementById('login'),dash=document.getElementById('dash');document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(r.ok){login.hidden=true;dash.hidden=false;load()}else document.getElementById('loginMsg').textContent=j.error};async function load(){const r=await fetch('/api/admin/members?status='+document.getElementById('filter').value);if(r.status===401)return;const a=await r.json();document.getElementById('members').innerHTML=a.length?a.map(m=>`<div class="member" style="margin-bottom:12px"><b>${esc(m.full_name)}</b><span>Database ID: ${m.id} • Member ID: ${esc(m.member_id)} • ${esc(m.phone||'No phone')}</span><span>Status: <b>${m.status.toUpperCase()}</b> • Rank: ${esc(m.rank||'Not assigned')} • Office: ${esc(m.unit||'—')}</span><div style="margin-top:10px"><button onclick="editMember(${m.id},'${esc(m.rank||'')}','${esc(m.unit||'')}','${esc(m.year_of_entry||'')}','${esc(m.office_description||'')}')">Edit office & rank</button> ${m.status!=='approved'?'<button onclick="setStatus('+m.id+',\'approved\')">Approve</button> ':''}${m.status!=='rejected'?'<button onclick="setStatus('+m.id+',\'rejected\')">Reject</button> ':''}</div></div>`).join(''):'<p class="muted">No members found.</p>'}function editMember(id,rank,unit,year,desc){document.getElementById('dbId').value=id;document.getElementById('rank').value=rank;document.getElementById('unit').value=unit;document.getElementById('year').value=year;document.getElementById('officeDescription').value=desc;window.scrollTo({top:document.getElementById('manageForm').offsetTop,behavior:'smooth'})}async function saveDetails(){const id=document.getElementById('dbId').value;const r=await fetch('/api/admin/members/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('filter').value==='all'?'pending':document.getElementById('filter').value,rank:document.getElementById('rank').value,unit:document.getElementById('unit').value,year_of_entry:document.getElementById('year').value,office_description:document.getElementById('officeDescription').value})});const j=await r.json();document.getElementById('detailMsg').textContent=r.ok?' Saved.':j.error;load()}async function setStatus(id,status){await fetch('/api/admin/members/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();document.getElementById('adminMsg').textContent=j.ok?' Admin added.':' '+j.error;e.target.reset()};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}fetch('/api/admin/me').then(r=>{if(r.ok){login.hidden=true;dash.hidden=false;load()}});</script></body></html>
