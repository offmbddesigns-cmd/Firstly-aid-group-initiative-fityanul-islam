<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Command Center</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6fb}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="cmd" src="/admin-command.html?embedded=1&v=20260913" title="Admin Command Center"></iframe><script>(function(){const f=document.getElementById('cmd');function unlock(){try{const w=f.contentWindow,d=f.contentDocument;if(!d)return;fetch('/api/admin/me',{cache:'no-store',credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(a=>{if(!a)return;const login=d.getElementById('login'),app=d.getElementById('app');if(login)login.classList.add('hidden');if(app)app.classList.remove('hidden');const id=d.getElementById('identity');if(id)id.textContent=a.username+' • '+a.role;try{if(typeof w.refreshAll==='function')w.refreshAll()}catch(e){}}).catch(function(){});}catch(e){}}f.addEventListener('load',function(){setTimeout(unlock,100)});setInterval(unlock,1200);})();</script></body></html>
