<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>Admin Login • Fityanul Islam Nigeria</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0,#e5f0ff,transparent 40%),radial-gradient(circle at 100% 100%,#eee7ff,transparent 40%),#f4f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid rgba(255,255,255,.9);border-radius:30px;background:rgba(255,255,255,.76);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 25px 70px rgba(31,41,55,.13)}img{width:92px;height:92px;display:block;margin:0 auto 16px;object-fit:contain;border-radius:24px}h1{text-align:center;font-size:26px;margin:0 0 6px}p{color:#6b7280;line-height:1.5}label{display:block;font-weight:700;margin:14px 0}input{display:block;width:100%;margin-top:7px;padding:14px 15px;border-radius:15px;border:1px solid rgba(17,24,39,.12);background:rgba(255,255,255,.8);font:inherit;outline:none}button{width:100%;border:0;border-radius:15px;padding:14px;background:#1677ff;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}.msg{min-height:24px;margin:12px 0 0;font-size:14px;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#1677ff;text-decoration:none;font-weight:700}.build{text-align:center;font-size:11px;color:#8b93a1;margin-top:18px;letter-spacing:.4px}</style></head><body><main class="card"><img src="/badge.jpg" alt="Fityanul Islam badge"><h1>Admin Command Center</h1><p>Secure administrator sign in for First Aid Group Initiative Fityanul Islam of Nigeria.</p><form id="loginForm" novalidate><label>Username<input id="username" name="username" autocomplete="username" required></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">Sign in securely</button><div id="msg" class="msg" role="alert"></div></form><a class="back" href="/">← Back to main website</a><div class="build">ADMIN PORTAL • LOGIN FIX BUILD 2026-09-13</div></main><script>(function(){const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),button=document.getElementById('loginButton');function show(t){msg.textContent=t}function post(url,data,done){const x=new XMLHttpRequest();x.open('POST',url,true);x.withCredentials=true;x.setRequestHeader('Content-Type','application/json');x.timeout=20000;x.onload=function(){let j={};try{j=JSON.parse(x.responseText||'{}')}catch(e){}if(x.status>=200&&x.status<300)done(null,j);else done(new Error(j.error||j.reason||('Server returned HTTP '+x.status)))};x.onerror=function(){done(new Error('Could not connect to the admin system. Please check your internet connection and try again.'))};x.ontimeout=function(){done(new Error('The admin server took too long to respond. Please try again.'))};x.send(JSON.stringify(data))}form.addEventListener('submit',function(e){e.preventDefault();const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!username||!password){show('Please enter both username and password.');return}button.disabled=true;button.textContent='Signing in…';show('Connecting to the secure admin system…');post('/api/admin/login',{username:username,password:password},function(err,j){if(err){show(err.message);button.disabled=false;button.textContent='Sign in securely';return}show('Login successful. Opening Command Center…');setTimeout(function(){location.href='/admin-command.html?v=adminloginfix20260913'},250)})});})();</script></body></html>
