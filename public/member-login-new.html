<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef4ff"><title>Fityanul Islam • Member Access</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;background:linear-gradient(145deg,#f8fbff,#dce8ff);color:#142033;display:flex;justify-content:center;padding:20px 15px}.wrap{width:min(520px,100%);padding-top:5vh}.card{background:rgba(255,255,255,.78);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:28px;box-shadow:0 20px 60px rgba(30,60,110,.18)}.logo{width:74px;height:74px;border-radius:22px;margin:auto;display:grid;place-items:center;background:#fff;font-weight:800;font-size:28px;box-shadow:0 8px 25px rgba(30,60,110,.12)}h1{text-align:center;margin:17px 0 7px;font-size:29px}p{text-align:center;color:#64748b;line-height:1.5;margin:0}.pill{display:block;width:max-content;margin:15px auto 25px;background:#edf4ff;color:#3768b8;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px}.label{font-weight:700;font-size:14px;display:block;margin-bottom:9px}input{display:block;width:100%;height:58px;border:1px solid #cbd5e1;border-radius:18px;background:#fff;padding:0 15px;text-align:center;font-size:21px;letter-spacing:4px;text-transform:uppercase;outline:none}button{display:block;width:100%;height:58px;border:0;border-radius:18px;margin-top:15px;background:#246bfe;color:#fff;font-size:17px;font-weight:750}button:disabled{opacity:.6}.msg{min-height:28px;text-align:center;margin-top:15px;font-size:14px;font-weight:700}.bad{color:#b42318}.ok{color:#16734b}.info{margin-top:18px;padding:14px;border-radius:18px;background:rgba(240,246,255,.75);color:#64748b;font-size:13px;line-height:1.45;text-align:center}.back{display:block;text-align:center;margin-top:17px;color:#3569b8;text-decoration:none;font-weight:650;font-size:14px}.build{text-align:center;color:#94a3b8;font-size:10px;letter-spacing:1px;margin-top:13px}</style></head><body><main class="wrap"><section class="card"><div class="logo">FI</div><h1>Member Access</h1><p>First Aid Group Initiative<br>Fityanul Islam of Nigeria</p><span class="pill">SECURE MEMBER PORTAL</span><label class="label" for="code">Member access code</label><input id="code" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="XXXXXXXXXX"><button id="login" type="button">Continue securely</button><div id="msg" class="msg" role="alert"></div><div class="info">Enter the 10-character code supplied by the administrator. Your code is not changed or deleted when you press the button.</div><a class="back" href="/">← Back to main website</a><div class="build">MEMBER PORTAL • LOGIN FIX BUILD 2026-09-13</div></section></main><script>(function(){var code=document.getElementById('code'),btn=document.getElementById('login'),msg=document.getElementById('msg');function show(t,c){msg.className='msg '+(c||'');msg.textContent=t}code.addEventListener('input',function(){var v=code.value.replace(/[^a-z0-9]/gi,'').toUpperCase().slice(0,10);code.value=v});function login(){var v=code.value.trim().toUpperCase();if(!/^[A-Z0-9]{10}$/.test(v)){show('Please enter exactly 10 characters. Your code is still in the box.','bad');return}btn.disabled=true;btn.textContent='Checking…';show('Connecting to the secure member system…','');var xhr=new XMLHttpRequest();xhr.open('POST','/api/member/login',true);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Cache-Control','no-cache');xhr.withCredentials=true;xhr.timeout=20000;xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;btn.disabled=false;btn.textContent='Continue securely';if(xhr.status>=200&&xhr.status<300){show('Login successful. Opening your profile…','ok');setTimeout(function(){location.href='/member.html?v=loginfix20260913'},300);return}var j={};try{j=JSON.parse(xhr.responseText||'{}')}catch(e){}show(j.error||j.reason||('Login failed (server response '+xhr.status+'). Please try again.'),'bad')};xhr.onerror=function(){btn.disabled=false;btn.textContent='Continue securely';show('The connection to the member server failed. Please check your internet connection and try again.','bad')};xhr.ontimeout=function(){btn.disabled=false;btn.textContent='Continue securely';show('The server took too long to respond. Please try again.','bad')};xhr.send(JSON.stringify({access_code:v}))}btn.addEventListener('click',login);code.addEventListener('keydown',function(e){if(e.key==='Enter')login()});})();</script></body></html>
