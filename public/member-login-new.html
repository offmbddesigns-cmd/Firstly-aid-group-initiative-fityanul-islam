<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef4ff"><title>Fityanul Islam • Member Access</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color:#142033;background:#eef4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#fff 0 20%,transparent 45%),linear-gradient(145deg,#eef4ff,#dce8ff 48%,#f8fbff);display:flex;justify-content:center;padding:24px 16px}.wrap{width:min(520px,100%);padding-top:5vh}.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.82);box-shadow:0 24px 70px rgba(40,65,110,.18),inset 0 1px rgba(255,255,255,.8);border-radius:32px;padding:30px}.brand{text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:24px;background:linear-gradient(145deg,#fff,#dbe8ff);display:grid;place-items:center;font-size:30px;font-weight:800;box-shadow:0 10px 30px rgba(40,70,130,.16)}h1{font-size:29px;margin:18px 0 7px;letter-spacing:-.7px}p{color:#64748b;line-height:1.5;margin:0}.pill{display:inline-block;margin:14px 0 24px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.72);color:#4267a8;font-size:12px;font-weight:700;letter-spacing:.4px}.field{margin-top:18px}label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}input{width:100%;height:58px;border:1px solid rgba(100,120,150,.22);border-radius:19px;background:rgba(255,255,255,.72);padding:0 18px;font-size:22px;letter-spacing:4px;text-align:center;text-transform:uppercase;outline:none;box-shadow:inset 0 1px 3px rgba(20,40,80,.05)}input:focus{border-color:#6b8fd6;box-shadow:0 0 0 4px rgba(80,120,210,.12)}button{width:100%;height:58px;margin-top:16px;border:0;border-radius:19px;background:linear-gradient(135deg,#246bfe,#5a8cff);color:white;font-size:17px;font-weight:750;box-shadow:0 12px 25px rgba(45,100,230,.25);cursor:pointer}button:disabled{opacity:.55}.msg{min-height:26px;margin-top:15px;text-align:center;font-size:14px;font-weight:650}.info{margin-top:22px;padding:15px 16px;border-radius:20px;background:rgba(255,255,255,.48);font-size:13px;color:#64748b}.ok{color:#16734b}.bad{color:#b42318}.build{text-align:center;margin-top:14px;color:#8a99ae;font-size:10px;letter-spacing:1px}</style></head><body><main class="wrap"><section class="glass"><div class="brand"><div class="logo">FI</div><h1>Member Access</h1><p>First Aid Group Initiative<br>Fityanul Islam of Nigeria</p><span class="pill">SECURE MEMBER PORTAL</span></div><div class="field"><label for="code">10-character member access code</label><input id="code" maxlength="10" minlength="10" autocomplete="one-time-code" inputmode="text" placeholder="XXXXXXXXXX"><button id="login">Continue securely</button><div id="msg" class="msg"></div></div><div class="info">Only approved members can access their profile. Enter the access code supplied by the administrator.</div><div class="build">MEMBER PORTAL • NEW BUILD 2026-09-13</div></section></main><script>const code=document.getElementById('code'),btn=document.getElementById('login'),msg=document.getElementById('msg');code.addEventListener('input',()=>{code.value=code.value.replace(/[^a-z0-9]/gi,'').toUpperCase().slice(0,10)});async function login(){const v=code.value.trim().toUpperCase();msg.className='msg';msg.textContent='';if(!/^[A-Z0-9]{10}$/.test(v)){msg.className='msg bad';msg.textContent='Enter exactly 10 letters or numbers.';return}btn.disabled=true;btn.textContent='Checking securely…';try{const r=await fetch('/api/member/login',{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},credentials:'include',cache:'no-store',body:JSON.stringify({access_code:v})});const j=await r.json().catch(()=>({}));if(!r.ok){msg.className='msg bad';msg.textContent=j.error||j.reason||'Login could not be completed.';return}window.location.href='/member.html?v=20260913-new'}catch(e){msg.className='msg bad';msg.textContent='Connection problem. Please try again.'}finally{btn.disabled=false;btn.textContent='Continue securely'}}btn.addEventListener('click',login);code.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
